<!DOCTYPE html>
<html>
<body style="background:#0b1220;color:white;padding:20px">

<h2>⚔️ Match Schedule</h2>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJie-ZFkaSjxAck7ohpegafgTyy6e-2AY",
  authDomain: "sunilesports-ff-4f4ad.firebaseapp.com",
  projectId: "sunilesports-ff-4f4ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const leagueId = new URLSearchParams(location.search).get("league");

onAuthStateChanged(auth, async (user) => {
  if (!user) location.href = "index.html";

  const q = query(collection(db, "matches"), where("leagueId", "==", leagueId));
  const snap = await getDocs(q);

  let html = "";
  snap.forEach(d => {
    const m = d.data();
    html += `
      <div style="border:1px solid gray;padding:10px;margin:10px">
        <b>${m.teamAName}</b> vs <b>${m.teamBName}</b><br>
        📅 ${m.date} ⏰ ${m.time}<br>
        Status: ${m.status}
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html || "No matches";
});
</script>

</body>
</html>
