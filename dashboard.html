<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sunil FF Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
.header{padding:15px;background:#111827;display:flex;justify-content:space-between}
.container{padding:15px}
.card{background:#111827;padding:15px;border-radius:10px;margin-bottom:15px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu div{background:#1f2933;padding:15px;border-radius:10px;text-align:center;cursor:pointer}
.menu div:hover{background:#22c55e;color:#000}
</style>
</head>

<body>

<div class="header">
  <div>
    <b>Sunil FF Tournament</b><br>
    <span id="userPhone"></span>
  </div>
  <div onclick="logout()">Logout</div>
</div>

<div class="container">
  <div class="card">Wallet: ₹0</div>
  <div class="card">No live match</div>

  <div class="menu">
    <div>Matches</div>
    <div>History</div>
    <div>Add Money</div>
    <div>Withdraw</div>
    <div>Settings</div>
    <div onclick="logout()">Logout</div>
  </div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem("user"));
  if(!user){
    window.location.href="index.html";
  } else {
    document.getElementById("userPhone").innerText = user.phoneNumber;
  }

  function logout(){
    localStorage.removeItem("user");
    window.location.href="index.html";
  }
</script>

</body>
</html>
