<!DOCTYPE html>
<html>
<body style="background:#0b1220;color:white;padding:20px">

<h2>🏆 Available Clash Squad Leagues</h2>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJie-ZFkaSjxAck7ohpegafgTyy6e-2AY",
  authDomain: "sunilesports-ff-4f4ad.firebaseapp.com",
  projectId: "sunilesports-ff-4f4ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) location.href = "index.html";

  const snap = await getDocs(collection(db, "leagues"));
  let html = "";

  snap.forEach(d => {
    const l = d.data();
    html += `
      <div style="border:1px solid gray;padding:10px;margin:10px">
        <b>${l.name}</b><br>
        Teams Limit: ${l.maxTeams}<br>
        Entry Fee: ₹${l.entryFee}<br>
        Type: ${l.matchType}<br>
        <button onclick="go('${d.id}')">Create / Join Team</button>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html || "No leagues";
});

window.go = (id) => {
  location.href = "team-create.html?league=" + id;
};
</script>

</body>
</html>
