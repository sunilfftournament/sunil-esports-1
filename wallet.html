<!DOCTYPE html>
<html>
<head>
  <title>Wallet - Sunil FF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{background:#0b1220;color:#fff;font-family:Arial;padding:20px}
    .box{max-width:400px;margin:auto;background:#111827;padding:20px;border-radius:10px}
    input,select,button{width:100%;padding:10px;margin-top:10px;border-radius:6px;border:none}
    button{background:#22c55e;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>

<div class="box">
  <h2>Add Money (UTR)</h2>

  <input id="amount" type="number" placeholder="Amount (50,100,150...)">
  <input id="utr" type="text" placeholder="Enter UTR Number">

  <button onclick="submitUTR()">Submit</button>

  <p id="msg"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } 
  from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDJie-ZFkaSjxAck7ohpegafgTyy6e-2AY",
    authDomain: "sunilesports-ff-4f4ad.firebaseapp.com",
    projectId: "sunilesports-ff-4f4ad",
    storageBucket: "sunilesports-ff-4f4ad.appspot.com",
    messagingSenderId: "929173626716",
    appId: "1:929173626716:web:15b971ba5ab9197da26b99"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const user = JSON.parse(localStorage.getItem("user"));
  if(!user){
    location.href = "index.html";
  }

  window.submitUTR = async function(){
    const amount = document.getElementById("amount").value;
    const utr = document.getElementById("utr").value;

    if(!amount || !utr){
      alert("Fill all fields");
      return;
    }

    await addDoc(collection(db, "wallet_requests"), {
      phone: user.phoneNumber,
      uid: user.uid,
      amount: amount,
      utr: utr,
      status: "pending",
      time: serverTimestamp()
    });

    document.getElementById("msg").innerText =
      "UTR submitted. Admin will confirm.";

    document.getElementById("amount").value="";
    document.getElementById("utr").value="";
  }
</script>

</body>
</html>
