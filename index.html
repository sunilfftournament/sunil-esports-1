<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sunil FF - Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{background:#081018;color:#dfe6ee;font-family:Arial;padding:30px}
    .card{max-width:420px;margin:30px auto;padding:20px;border-radius:10px;background:rgba(0,0,0,0.45);box-shadow:0 6px 20px rgba(0,0,0,0.6)}
    input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #223;}
    button{width:100%;padding:12px;background:#22c55e;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>

  <div class="card">
    <h2 style="text-align:center">Login with Phone</h2>
    <input id="phone" placeholder="Enter 10-digit number (e.g. 9876543210)" />
    <button id="sendBtn" onclick="sendOTP()">Send OTP</button>

    <div style="margin-top:12px">
      <input id="otp" placeholder="Enter OTP" />
      <button onclick="verifyOTP()">Verify OTP</button>
    </div>

    <div id="recaptcha-container"></div>
  </div>

<script type="module">
  // Firebase core + Auth (CDN)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

  // ← paste your firebaseConfig here (yahi tumne console se copy kiya tha)
  const firebaseConfig = {
    apiKey: "AIzaSyDJie-ZFkaSjxAck7ohpegafgTyy6e-2AY",
    authDomain: "sunilesports-ff-4f4ad.firebaseapp.com",
    projectId: "sunilesports-ff-4f4ad",
    storageBucket: "sunilesports-ff-4f4ad.appspot.com",
    messagingSenderId: "929173626716",
    appId: "1:929173626716:web:15b971ba5ab9197da26b99"
  };

  // init
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // invisible reCAPTCHA (required by Firebase for Phone Auth)
  window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
    size: 'invisible'
  });

  // send OTP
  window.sendOTP = async function () {
    const phone = document.getElementById('phone').value.trim();
    if (!/^\d{10}$/.test(phone)) return alert('Enter a valid 10-digit number');
    const phoneNumber = '+91' + phone;
    try {
      const appVerifier = window.recaptchaVerifier;
      const result = await signInWithPhoneNumber(auth, phoneNumber, appVerifier);
      window.confirmationResult = result;
      alert('OTP sent to ' + phoneNumber + '. (If using test number, use the test code.)');
      document.getElementById('sendBtn').innerText = 'Resend OTP';
    } catch (err) {
      alert('Send failed: ' + (err && err.message ? err.message : err));
      console.error(err);
    }
  };

  // verify OTP
  window.verifyOTP = async function () {
    const code = document.getElementById('otp').value.trim();
    if (!code) return alert('Enter OTP');
    try {
      const res = await window.confirmationResult.confirm(code);
      // login success — res.user contains user data
      alert('Login successful: ' + (res.user.phoneNumber || ''));
      // TODO: redirect to dashboard, and save user info to Firestore
      // location.href = '/dashboard.html';
      console.log(res.user);
    } catch (err) {
      alert('Verify failed: ' + (err && err.message ? err.message : err));
      console.error(err);
    }
  };
</script>

</body>
</html>
