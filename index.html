<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sunil FF Tournament Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #0b1220;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .box {
      max-width: 400px;
      margin: 80px auto;
      padding: 20px;
      background: #111827;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #22c55e;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- 🔥 LOGIN UI -->
  <div class="box">
    <h2>Sunil FF Login</h2>

    <input type="text" id="phone" placeholder="Enter 10 digit mobile number">
    <button onclick="sendOTP()">Send OTP</button>

    <input type="text" id="otp" placeholder="Enter OTP">
    <button onclick="verifyOTP()">Verify & Login</button>

    <div id="recaptcha-container"></div>
  </div>

  <!-- 🔥 FIREBASE LOGIN CODE (HAMESHA BODY KE LAST ME) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJie-ZFkaSjxAck7ohpegafgTyy6e-2AY",
      authDomain: "sunilesports-ff-4f4ad.firebaseapp.com",
      projectId: "sunilesports-ff-4f4ad",
      storageBucket: "sunilesports-ff-4f4ad.appspot.com",
      messagingSenderId: "929173626716",
      appId: "1:929173626716:web:15b971ba5ab9197da26b99"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.recaptchaVerifier = new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      { size: "invisible" }
    );

    window.sendOTP = function () {
      const phone = document.getElementById("phone").value.trim();

      if (!/^\d{10}$/.test(phone)) {
        alert("Enter valid 10 digit number");
        return;
      }

      const phoneNumber = "+91" + phone;

      signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          alert("OTP sent");
        })
        .catch((error) => {
          alert(error.message);
        });
    };

    window.verifyOTP = function () {
      const otp = document.getElementById("otp").value.trim();

      if (!otp) {
        alert("Enter OTP");
        return;
      }

      window.confirmationResult.confirm(otp)
        .then((result) => {
          // ✅ LOGIN SUCCESS
          localStorage.setItem("user", JSON.stringify(result.user));
          window.location.href = "dashboard.html";
        })
        .catch(() => {
          alert("Wrong OTP");
        });
    };
  </script>

</body>
</html>
